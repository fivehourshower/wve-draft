<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NQ Tournament Drafter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Spectral+SC:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2c2417;
    --ink-soft:#6a5d49;
    --ink-faint:#9a8c74;
    --parchment:#ece2cd;
    --panel:rgba(252,247,237,0.86);
    --panel-solid:#fbf6ec;
    --line:rgba(90,68,38,0.16);
    --line-strong:rgba(90,68,38,0.30);
    --gold:#a9802f;
    --gold-bright:#c79b45;
    --burgundy:#7a2c25;
    --burgundy-dk:#5f211b;
    --tier-S:#9c2230;
    --tier-A:#b06a1a;
    --tier-B:#3f7d4e;
    --tier-C:#3a6ea5;
    --tier-D:#736a59;
    --shadow:0 1px 2px rgba(60,40,15,0.10), 0 12px 34px -12px rgba(60,40,15,0.30);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Spectral',Georgia,serif;
    color:var(--ink);
    min-height:100vh;
    background-color:#e7dcc4;
    background-image:
      radial-gradient(120% 90% at 18% 0%, rgba(255,250,238,0.95), rgba(255,250,238,0) 55%),
      radial-gradient(120% 100% at 92% 8%, rgba(214,196,160,0.55), rgba(214,196,160,0) 60%),
      radial-gradient(140% 120% at 50% 120%, rgba(120,98,60,0.30), rgba(120,98,60,0) 60%),
      linear-gradient(168deg, #efe6d1 0%, #e6dabf 46%, #dccbab 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  /* faint old-map texture */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    opacity:0.06;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:48px 24px 80px;}

  /* ---- masthead ---- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px;border-bottom:2px solid var(--line-strong);padding-bottom:20px;}
  .brand{display:flex;flex-direction:column;gap:6px;}
  .crest{display:flex;align-items:center;gap:14px;}
  .crest-mark{width:42px;height:42px;flex:none;color:var(--burgundy);}
  .title{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(28px,4vw,44px);letter-spacing:0.03em;line-height:1;margin:0;color:var(--ink);}
  .sub{font-family:'Spectral SC','Spectral',serif;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-faint);margin:0;padding-left:56px;}

  /* ---- cards ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);backdrop-filter:blur(3px);margin-bottom:22px;overflow:hidden;}
  .card-head{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg, rgba(255,252,245,0.7), rgba(236,226,205,0.35));}
  .card-head h2{font-family:'Cinzel',serif;font-weight:600;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;margin:0;color:var(--ink);white-space:nowrap;}
  .card-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent);}
  .card-body{padding:24px 22px 26px;}

  /* ---- fields ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px;}
  @media(max-width:620px){.grid2{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:9px;}
  .label{font-family:'Spectral SC','Spectral',serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .hint{font-size:12.5px;color:var(--ink-faint);font-style:italic;}

  /* segmented control */
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;background:rgba(255,255,255,0.4);width:fit-content;}
  .seg-btn{appearance:none;border:0;background:transparent;font-family:'Spectral',serif;font-size:15px;color:var(--ink-soft);padding:9px 18px;cursor:pointer;border-right:1px solid var(--line);transition:background .15s,color .15s;min-width:46px;white-space:nowrap;}
  .seg-btn:last-child{border-right:0;}
  .seg-btn:hover{background:rgba(169,128,47,0.10);}
  .seg-btn[aria-pressed="true"]{background:var(--burgundy);color:#f6ecd8;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);}

  /* number stepper */
  .stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;width:fit-content;background:rgba(255,255,255,0.5);}
  .stepper button{appearance:none;border:0;background:transparent;width:40px;font-size:20px;color:var(--burgundy);cursor:pointer;line-height:1;transition:background .15s;}
  .stepper button:hover{background:rgba(122,44,37,0.10);}
  .stepper button:disabled{color:var(--ink-faint);cursor:not-allowed;}
  .stepper .val{min-width:54px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:18px;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:8px 0;}

  /* rating control */
  .rating-row{display:flex;align-items:center;gap:16px;}
  .rating-val{font-family:'Cinzel',serif;font-weight:700;font-size:30px;color:var(--burgundy);min-width:78px;text-align:center;background:rgba(255,255,255,0.55);border:1px solid var(--line-strong);border-radius:3px;padding:4px 0;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--tier-D),var(--tier-C),var(--tier-B),var(--tier-A),var(--tier-S));outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff6e2, var(--gold));border:2px solid var(--burgundy-dk);cursor:pointer;box-shadow:0 1px 4px rgba(60,40,15,0.4);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff6e2, var(--gold));border:2px solid var(--burgundy-dk);cursor:pointer;}
  .scale-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);letter-spacing:.04em;margin-top:2px;}

  /* select */
  .select{position:relative;width:fit-content;}
  select{appearance:none;font-family:'Spectral',serif;font-size:16px;color:var(--ink);background:rgba(255,255,255,0.55);border:1px solid var(--line-strong);border-radius:3px;padding:10px 42px 10px 16px;cursor:pointer;min-width:230px;}
  .select::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft);transform:translateY(-65%) rotate(45deg);pointer-events:none;}

  /* actions */
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line);}
  .btn{appearance:none;font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;padding:13px 26px;cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s;display:inline-flex;align-items:center;gap:9px;border:1px solid transparent;}
  .btn:active{transform:translateY(1px);}
  .btn svg{width:17px;height:17px;}
  .btn-primary{background:linear-gradient(180deg,var(--burgundy),var(--burgundy-dk));color:#f6ecd8;border-color:var(--burgundy-dk);box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 6px 16px -8px rgba(95,33,27,0.8);}
  .btn-primary:hover{background:linear-gradient(180deg,#8c352c,#6a261f);}
  .btn-ghost{background:rgba(255,255,255,0.4);color:var(--ink);border-color:var(--line-strong);}
  .btn-ghost:hover{background:rgba(169,128,47,0.14);border-color:var(--gold);}
  .btn-ghost:disabled{color:var(--ink-faint);cursor:not-allowed;opacity:.55;}
  .btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#3a2c10;border-color:var(--gold);box-shadow:0 1px 0 rgba(255,255,255,0.3) inset;}
  .btn-gold:hover{filter:brightness(1.06);}

  /* warning */
  .warn{margin-top:18px;padding:13px 16px;border-left:3px solid var(--tier-S);background:rgba(156,34,48,0.08);color:#7a1f2a;font-size:14.5px;border-radius:0 3px 3px 0;}

  /* share */
  .share-box{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .share-field{flex:1;min-width:220px;font-family:'Spectral',serif;font-size:13.5px;color:var(--ink-soft);background:rgba(255,255,255,0.6);border:1px dashed var(--line-strong);border-radius:3px;padding:11px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .copied-note{font-family:'Spectral SC','Spectral',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tier-B);opacity:0;transition:opacity .2s;}
  .copied-note.show{opacity:1;}

  /* ---- results ---- */
  .result-meta{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:24px;font-size:14.5px;color:var(--ink-soft);}
  .meta-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.5);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-family:'Spectral SC','Spectral',serif;letter-spacing:.06em;font-size:12.5px;text-transform:uppercase;color:var(--ink);}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  @media(max-width:680px){.teams{grid-template-columns:1fr;}}
  .team{}
  .team-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .team-head h3{font-family:'Cinzel',serif;font-weight:700;font-size:16px;letter-spacing:.08em;margin:0;color:var(--burgundy);white-space:nowrap;}
  .team-head .rule{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);}
  .player{padding:15px 0;border-bottom:1px solid var(--line);}
  .player:last-child{border-bottom:0;}
  .player-name{font-family:'Spectral SC','Spectral',serif;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 11px;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;}
  .chip{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,0.55);border:1px solid var(--line);border-radius:999px;padding:5px 15px 5px 5px;box-shadow:0 1px 2px rgba(60,40,15,0.07);}
  .chip-img{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;box-shadow:0 0 0 2px rgba(169,128,47,0.55), 0 1px 3px rgba(0,0,0,0.35);background:#3a3326;}
  .chip-ph{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:#f6ecd8;box-shadow:0 0 0 2px rgba(169,128,47,0.55), 0 1px 3px rgba(0,0,0,0.35);}
  .chip-name{font-size:16px;color:var(--ink);font-weight:500;padding-right:4px;}
  .chip-tier{font-family:'Cinzel',serif;font-size:10.5px;font-weight:700;color:#fff;border-radius:3px;padding:1px 5px;margin-left:-2px;}

  /* viewer banner */
  .banner{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg, rgba(122,44,37,0.10), rgba(122,44,37,0.04));border:1px solid var(--line-strong);border-left:4px solid var(--burgundy);border-radius:3px;padding:13px 18px;margin-bottom:22px;font-size:14.5px;color:var(--ink);}
  .banner svg{width:20px;height:20px;color:var(--burgundy);flex:none;}
  .banner b{font-family:'Spectral SC','Spectral',serif;letter-spacing:.08em;}

  .empty{padding:30px 4px;color:var(--ink-faint);font-style:italic;font-size:15px;}
  .foot{margin-top:40px;text-align:center;font-size:12px;color:var(--ink-faint);letter-spacing:.06em;}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="civdata.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
